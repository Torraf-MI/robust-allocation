[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "robust-allocation"
version = "0.1.0"
description = "Allocazione robusta del portafoglio: Black-Litterman con le view del consulente, Hierarchical Risk Parity, minimo CVaR, frontiera ricampionata, vincoli di mandato, costi e backtest walk-forward"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Francesco Torraco" }]
keywords = ["black-litterman", "hierarchical risk parity", "cvar", "portfolio optimization", "asset allocation", "wealth management"]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.11",
    "pandas>=2.2",
    "plotly>=5.20",
    "jinja2>=3.1",
]

[project.optional-dependencies]
png = ["kaleido>=1.0"]
dev = ["pytest>=7", "ruff>=0.4"]

[project.scripts]
robust-allocation = "robust_allocation.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
robust_allocation = ["templates/*.j2"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B905"]
